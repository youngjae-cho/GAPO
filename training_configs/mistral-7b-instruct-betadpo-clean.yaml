# Model arguments
model_name_or_path: mistralai/Mistral-7B-Instruct-v0.2
torch_dtype: auto
attn_implementation: flash_attention_2

# Data training arguments
dataset_mixer:
  princeton-nlp/mistral-instruct-ultrafeedback: 1.0

dataset_splits:
- train
- test
preprocessing_num_workers: 12

# BetaDPOTrainer arguments
bf16: true
beta: 0.1
a: 0.6
mode_weight: 0.2
do_eval: true
evaluation_strategy: steps
eval_steps: 400
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
hub_model_id: betadpo-exps
learning_rate: 5.0e-7
log_level: info
logging_steps: 5
lr_scheduler_type: cosine
max_length: 2048
max_prompt_length: 1800
num_train_epochs: 1
optim: adamw_torch
output_dir: outputs/mistral-7b-instruct-betadpo_clean
run_name: s2_betadpo_clean
per_device_train_batch_size: 8
per_device_eval_batch_size: 4
push_to_hub: false
save_strategy: "steps"
save_steps: 116
report_to:
- wandb
save_total_limit: 20
seed: 42
warmup_ratio: 0.1
